<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MentionMarkets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1a2332;
            color: #e5e7eb;
            font-size: 14px;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #374151;
        }

        h1 {
            font-size: 28px;
            color: #3b82f6;
        }

        .back-link {
            padding: 8px 16px;
            background: #374151;
            color: #e5e7eb;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .back-link:hover {
            background: #4b5563;
        }

        .card {
            background: #2d3748;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #60a5fa;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #9ca3af;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #1a2332;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        textarea {
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-secondary {
            background: #374151;
        }

        .button-secondary:hover {
            background: #4b5563;
        }

        .qa-analytics {
            background: #1e3a5f;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 16px;
        }

        .qa-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .qa-stat {
            background: #1a2332;
            padding: 12px;
            border-radius: 6px;
        }

        .qa-stat-label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .qa-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
        }

        .qa-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .qa-item {
            background: #1a2332;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .qa-question {
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 6px;
        }

        .qa-text {
            font-size: 13px;
            color: #d1d5db;
            font-style: italic;
            margin-bottom: 8px;
        }

        .qa-metrics {
            font-size: 12px;
            color: #9ca3af;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .alert-success {
            background: #064e3b;
            border: 1px solid #10b981;
            color: #6ee7b7;
        }

        .alert-error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .alert-warning {
            background: #78350f;
            border: 1px solid #f59e0b;
            color: #fcd34d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <a href="/" class="back-link">← Back to Search</a>
        </div>

        <div style="display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid #374151; padding-bottom: 0;">
            <button onclick="showTab('upload')" id="uploadTab" style="padding: 12px 24px; background: transparent; border: none; border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 600; cursor: pointer;">
                📝 Upload Transcript
            </button>
            <button onclick="showTab('database')" id="databaseTab" style="padding: 12px 24px; background: transparent; border: none; border-bottom: 3px solid transparent; color: #9ca3af; font-weight: 600; cursor: pointer;">
                📊 View Database
            </button>
            <button onclick="showTab('speechTypes')" id="speechTypesTab" style="padding: 12px 24px; background: transparent; border: none; border-bottom: 3px solid transparent; color: #9ca3af; font-weight: 600; cursor: pointer;">
                🎯 Speech Types
            </button>
        </div>

        <div id="alertContainer"></div>

        <div id="uploadSection">
        <div class="card">
            <h2>Upload Transcript</h2>
            
            <div class="form-group">
                <label>Transcript Text (Otter.ai format)</label>
                
                <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                    <button type="button" onclick="document.getElementById('fileInput').click()" class="button-secondary" style="flex: 1;">
                        📎 Upload .txt File
                    </button>
                    <button type="button" onclick="clearTranscript()" class="button-secondary" style="flex: 1;">
                        🗑️ Clear
                    </button>
                </div>
                
                <input type="file" id="fileInput" accept=".txt" style="display: none;" onchange="handleFileUpload(event)">
                
                <div id="fileInfo" style="display: none; background: #1e3a5f; border: 1px solid #3b82f6; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px;">
                    <span style="color: #60a5fa;">📄</span> <span id="fileName"></span>
                    <span style="color: #9ca3af; margin-left: 8px;" id="fileSize"></span>
                </div>
                
                <textarea id="transcriptText" rows="12" placeholder="Paste your Otter.ai transcript here, or click 'Upload .txt File' above...

Example format:
Speaker Name  0:22  
Text content here...

Speaker Name  1:30  
More text..."></textarea>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="e.g., Mayor Mamdani Press Conference">
            </div>

            <div class="form-group">
                <label>Event Date</label>
                <input type="date" id="eventDate">
            </div>

            <div class="form-group">
                <label>Speech Type</label>
                <select id="speechType">
                    <option value="">Select...</option>
                    <option value="Remarks">Remarks</option>
                    <option value="Press Conference">Press Conference</option>
                    <option value="Interview">Interview</option>
                    <option value="Rally">Rally</option>
                    <option value="Press Briefing">Press Briefing</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Primary Speaker</label>
                <select id="primarySpeaker">
                    <option value="">Select speaker...</option>
                    <option value="Mamdani">Mamdani</option>
                    <option value="Trump">Trump</option>
                    <option value="JD Vance">JD Vance</option>
                    <option value="Hochul">Hochul</option>
                    <option value="Karoline Leavitt">Karoline Leavitt</option>
                    <option value="__custom__">+ Add Custom Speaker</option>
                </select>
                <input type="text" id="customSpeaker" placeholder="Enter custom speaker name..." style="display: none; margin-top: 8px;">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="hasQA">
                <label for="hasQA" style="margin-bottom: 0;">Has Q&A Section (auto-detect questions)</label>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button onclick="parseTranscript()">📊 Parse Transcript</button>
                <button onclick="saveTranscript()" class="button-secondary" id="saveBtn" disabled>💾 Save to Database</button>
            </div>
        </div>

        <div id="qaAnalytics" style="display: none;"></div>

        <div id="previewSection" style="display: none;">
            <div class="card">
                <h2>Preview</h2>
                <div id="previewContent"></div>
            </div>
        </div>
        </div>

        <div id="speechTypesSection" style="display: none;">
            <div class="card">
                <h2>Manage Speech Types</h2>
                <p style="color: #9ca3af; margin-bottom: 20px;">Add custom speech types that will appear in upload forms and search filters</p>
                
                <div class="form-group">
                    <label>Add New Speech Type</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="text" id="newSpeechType" placeholder="e.g., Town Hall, Debate, Committee Hearing..." style="flex: 1;">
                        <button onclick="addSpeechType()">➕ Add</button>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <h3 style="font-size: 16px; color: #60a5fa; margin-bottom: 12px;">Current Speech Types</h3>
                    <div id="speechTypesList" style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <!-- Speech types will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <div id="databaseSection" style="display: none;">
            <div class="card">
                <h2>Database Overview</h2>
                <div id="speakerBoxes" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 16px;">
                    <!-- Speaker boxes will be loaded here -->
                </div>
            </div>

            <div id="transcriptsList" style="display: none;">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h2 id="speakerName">Transcripts</h2>
                        <button onclick="showSpeakerBoxes()" class="button-secondary">← Back to Speakers</button>
                    </div>
                    <div id="transcriptsContent"></div>
                </div>
            </div>

            <div id="editTranscript" style="display: none;">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h2>Edit Transcript</h2>
                        <button onclick="cancelEdit()" class="button-secondary">✕ Cancel</button>
                    </div>
                    
                    <input type="hidden" id="editTranscriptId">
                    
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="editTitle">
                    </div>

                    <div class="form-group">
                        <label>Event Date</label>
                        <input type="date" id="editDate">
                    </div>

                    <div class="form-group">
                        <label>Speech Type</label>
                        <select id="editSpeechType">
                            <option value="Remarks">Remarks</option>
                            <option value="Press Conference">Press Conference</option>
                            <option value="Interview">Interview</option>
                            <option value="Rally">Rally</option>
                            <option value="Press Briefing">Press Briefing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Transcript Text</label>
                        <textarea id="editFullText" rows="15" style="font-family: monospace; font-size: 12px;"></textarea>
                    </div>

                    <div id="editQAAnalytics" style="display: none;"></div>

                    <div style="display: flex; gap: 12px;">
                        <button onclick="saveEdit()">💾 Save Changes</button>
                        <button onclick="deleteTranscript()" style="background: #dc2626;" onmouseover="this.style.background='#b91c1c'" onmouseout="this.style.background='#dc2626'">🗑️ Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = null;
        let currentSpeaker = null;
        let allTranscripts = [];

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Show file info
            document.getElementById('fileInfo').style.display = 'block';
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = `(${(file.size / 1024).toFixed(1)} KB)`;

            // Read file content
            const reader = new FileReader();
            reader.onload = function(e) {
                let content = e.target.result;
                
                // Auto-remove "Transcribed by otter.ai" footer
                content = content.replace(/Transcribed by https?:\/\/otter\.ai\s*$/i, '');
                content = content.replace(/Transcribed by otter\.ai\s*$/i, '');
                content = content.trim();
                
                document.getElementById('transcriptText').value = content;

                // Auto-fill title from filename (remove .txt extension)
                const titleField = document.getElementById('title');
                if (!titleField.value || titleField.value === 'e.g., Mayor Mamdani Press Conference') {
                    let titleFromFile = file.name.replace(/\.txt$/i, '');
                    // Clean up common patterns like dates, timestamps
                    titleFromFile = titleFromFile
                        .replace(/_/g, ' ')  // Replace underscores with spaces
                        .replace(/-/g, ' ')  // Replace hyphens with spaces
                        .replace(/\s+/g, ' ')  // Normalize multiple spaces
                        .trim();
                    titleField.value = titleFromFile;
                    
                    // Auto-detect primary speaker from filename
                    const speakerSelect = document.getElementById('primarySpeaker');
                    const lowerTitle = titleFromFile.toLowerCase();
                    if (lowerTitle.includes('mamdani')) {
                        speakerSelect.value = 'Mamdani';
                    } else if (lowerTitle.includes('hochul')) {
                        speakerSelect.value = 'Hochul';
                    } else if (lowerTitle.includes('trump')) {
                        speakerSelect.value = 'Trump';
                    } else if (lowerTitle.includes('vance')) {
                        speakerSelect.value = 'JD Vance';
                    }
                }

                showAlert(`📄 File loaded: ${file.name}`, 'success');
            };
            reader.onerror = function() {
                showAlert('Error reading file', 'error');
            };
            reader.readAsText(file);
        }

        function clearTranscript() {
            document.getElementById('transcriptText').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').style.display = 'none';
            showAlert('Transcript cleared', 'warning');
        }

        // Handle primary speaker dropdown
        document.addEventListener('DOMContentLoaded', function() {
            const speakerSelect = document.getElementById('primarySpeaker');
            const customSpeakerInput = document.getElementById('customSpeaker');
            
            if (speakerSelect) {
                speakerSelect.addEventListener('change', function() {
                    if (this.value === '__custom__') {
                        customSpeakerInput.style.display = 'block';
                        customSpeakerInput.focus();
                    } else {
                        customSpeakerInput.style.display = 'none';
                        customSpeakerInput.value = '';
                    }
                });
            }
        });

        function showTab(tab) {
            const uploadSection = document.getElementById('uploadSection');
            const databaseSection = document.getElementById('databaseSection');
            const speechTypesSection = document.getElementById('speechTypesSection');
            const uploadTab = document.getElementById('uploadTab');
            const databaseTab = document.getElementById('databaseTab');
            const speechTypesTab = document.getElementById('speechTypesTab');

            // Hide all sections
            uploadSection.style.display = 'none';
            databaseSection.style.display = 'none';
            speechTypesSection.style.display = 'none';

            // Reset all tab styles
            uploadTab.style.borderBottomColor = 'transparent';
            uploadTab.style.color = '#9ca3af';
            databaseTab.style.borderBottomColor = 'transparent';
            databaseTab.style.color = '#9ca3af';
            speechTypesTab.style.borderBottomColor = 'transparent';
            speechTypesTab.style.color = '#9ca3af';

            // Show selected tab
            if (tab === 'upload') {
                uploadSection.style.display = 'block';
                uploadTab.style.borderBottomColor = '#3b82f6';
                uploadTab.style.color = '#3b82f6';
            } else if (tab === 'database') {
                databaseSection.style.display = 'block';
                databaseTab.style.borderBottomColor = '#3b82f6';
                databaseTab.style.color = '#3b82f6';
                loadSpeakerBoxes();
            } else if (tab === 'speechTypes') {
                speechTypesSection.style.display = 'block';
                speechTypesTab.style.borderBottomColor = '#3b82f6';
                speechTypesTab.style.color = '#3b82f6';
                loadSpeechTypes();
            }
        }

        async function loadSpeakerBoxes() {
            try {
                const response = await fetch('/api/admin/transcripts/by-speaker');
                if (!response.ok) throw new Error('Failed to load transcripts');
                
                const data = await response.json();
                allTranscripts = data.transcripts || [];
                
                const speakerBoxes = document.getElementById('speakerBoxes');
                const speakerCounts = {};
                
                // Group by primary speaker (use primary_speaker field if available, otherwise extract from title)
                allTranscripts.forEach(t => {
                    let speaker = 'Other';
                    
                    // First priority: use primary_speaker field
                    if (t.primary_speaker && t.primary_speaker.trim()) {
                        speaker = t.primary_speaker.trim();
                    } else {
                        // Fallback: extract from title or speakers
                        const speakers = t.speakers || [];
                        const title = (t.title || '').toLowerCase();
                        
                        if (title.includes('mamdani') || speakers.some(s => s.toLowerCase().includes('mamdani'))) {
                            speaker = 'Mamdani';
                        } else if (title.includes('trump') || speakers.some(s => s.toLowerCase().includes('trump'))) {
                            speaker = 'Trump';
                        } else if (title.includes('hochul') || speakers.some(s => s.toLowerCase().includes('hochul'))) {
                            speaker = 'Hochul';
                        } else if (title.includes('vance') || speakers.some(s => s.toLowerCase().includes('vance'))) {
                            speaker = 'JD Vance';
                        } else if (title.includes('leavitt') || speakers.some(s => s.toLowerCase().includes('leavitt'))) {
                            speaker = 'Karoline Leavitt';
                        }
                    }
                    
                    t.primarySpeaker = speaker;
                    speakerCounts[speaker] = (speakerCounts[speaker] || 0) + 1;
                });
                
                // Create speaker boxes dynamically for all speakers found
                const speakerColors = {
                    'Mamdani': '#3b82f6',
                    'Trump': '#ef4444',
                    'Hochul': '#8b5cf6',
                    'JD Vance': '#f59e0b',
                    'Karoline Leavitt': '#10b981',
                    'Other': '#6b7280'
                };
                
                // Get all unique speakers, sorted by count
                const sortedSpeakers = Object.entries(speakerCounts)
                    .sort(([,a], [,b]) => b - a)
                    .map(([speaker]) => speaker);
                
                let html = '';
                sortedSpeakers.forEach(speaker => {
                    const count = speakerCounts[speaker] || 0;
                    // Assign color based on speaker, default to rotating colors for unknowns
                    let color = speakerColors[speaker];
                    if (!color) {
                        const colors = ['#3b82f6', '#ef4444', '#8b5cf6', '#f59e0b', '#10b981', '#ec4899', '#06b6d4'];
                        const index = sortedSpeakers.indexOf(speaker) % colors.length;
                        color = colors[index];
                    }
                    
                    html += `
                        <div onclick="showSpeakerTranscripts('${speaker.replace(/'/g, "\\'")')" 
                             style="background: linear-gradient(135deg, ${color}22 0%, ${color}11 100%); 
                                    border: 2px solid ${color}; padding: 24px; border-radius: 8px; 
                                    cursor: pointer; transition: all 0.2s; text-align: center;"
                             onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 16px rgba(0,0,0,0.3)'"
                             onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none'">
                            <div style="font-size: 48px; font-weight: 700; color: ${color}; margin-bottom: 8px;">${count}</div>
                            <div style="font-size: 18px; font-weight: 600; color: #e5e7eb;">${speaker}</div>
                            <div style="font-size: 13px; color: #9ca3af; margin-top: 4px;">transcript${count !== 1 ? 's' : ''}</div>
                        </div>
                    `;
                });
                
                speakerBoxes.innerHTML = html;
                
                // Show speaker boxes, hide transcript list and edit form
                speakerBoxes.parentElement.style.display = 'block';
                document.getElementById('transcriptsList').style.display = 'none';
                document.getElementById('editTranscript').style.display = 'none';
                
            } catch (error) {
                showAlert('Error loading database: ' + error.message, 'error');
            }
        }

        function showSpeakerBoxes() {
            document.getElementById('speakerBoxes').parentElement.style.display = 'block';
            document.getElementById('transcriptsList').style.display = 'none';
            document.getElementById('editTranscript').style.display = 'none';
        }

        function showSpeakerTranscripts(speaker) {
            currentSpeaker = speaker;
            const filtered = allTranscripts.filter(t => t.primarySpeaker === speaker);
            
            document.getElementById('speakerName').textContent = `${speaker} (${filtered.length} transcripts)`;
            
            let html = '';
            if (filtered.length === 0) {
                html = '<p style="color: #9ca3af;">No transcripts found for this speaker.</p>';
            } else {
                filtered.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                filtered.forEach(t => {
                    html += `
                        <div onclick="editTranscriptById(${t.id})" 
                             style="background: #1a2332; border: 1px solid #374151; border-radius: 6px; 
                                    padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;"
                             onmouseover="this.style.borderColor='#3b82f6'; this.style.background='#1e293b'"
                             onmouseout="this.style.borderColor='#374151'; this.style.background='#1a2332'">
                            <div style="font-weight: 600; color: #e5e7eb; margin-bottom: 6px;">${t.title || 'Untitled'}</div>
                            <div style="font-size: 12px; color: #9ca3af;">
                                📅 ${t.date || 'No date'} • 
                                📝 ${t.speech_type || 'Unknown'} • 
                                💬 ${t.word_count || 0} words
                            </div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('transcriptsContent').innerHTML = html;
            document.getElementById('speakerBoxes').parentElement.style.display = 'none';
            document.getElementById('transcriptsList').style.display = 'block';
            document.getElementById('editTranscript').style.display = 'none';
        }

        async function editTranscriptById(id) {
            try {
                const response = await fetch(`/api/admin/transcripts/${id}`);
                if (!response.ok) throw new Error('Failed to load transcript');
                
                const transcript = await response.json();
                
                document.getElementById('editTranscriptId').value = transcript.id;
                document.getElementById('editTitle').value = transcript.title || '';
                document.getElementById('editDate').value = transcript.date || '';
                document.getElementById('editSpeechType').value = transcript.speech_type || 'Other';
                document.getElementById('editFullText').value = transcript.full_dialogue || transcript.full_text || '';
                
                // Display Q&A analytics if available
                const qaContainer = document.getElementById('editQAAnalytics');
                if (transcript.has_q_and_a && transcript.qa_analytics) {
                    displayQAAnalyticsInEdit(transcript.qa_analytics);
                    qaContainer.style.display = 'block';
                } else {
                    qaContainer.style.display = 'none';
                }
                
                document.getElementById('transcriptsList').style.display = 'none';
                document.getElementById('editTranscript').style.display = 'block';
                
            } catch (error) {
                showAlert('Error loading transcript: ' + error.message, 'error');
            }
        }

        function displayQAAnalyticsInEdit(qa) {
            const container = document.getElementById('editQAAnalytics');
            if (!qa || qa.questionCount === 0) {
                container.innerHTML = '<div class="alert alert-warning">⚠️ No Q&A data available</div>';
                return;
            }

            let html = '<div class="qa-analytics" style="margin-bottom: 20px;"><h3 style="color: #60a5fa; margin-bottom: 16px;">📊 Q&A Analytics</h3>';
            html += '<div class="qa-stats">';
            html += `<div class="qa-stat"><div class="qa-stat-label">Questions Asked</div><div class="qa-stat-value">${qa.questionCount}</div></div>`;
            html += `<div class="qa-stat"><div class="qa-stat-label">Avg Response Length</div><div class="qa-stat-value">${qa.avgResponseWords} words</div></div>`;
            html += `<div class="qa-stat"><div class="qa-stat-label">Avg Response Time</div><div class="qa-stat-value">${qa.avgResponseSeconds !== null ? qa.avgResponseSeconds + 's' : 'N/A'}</div></div>`;
            html += '</div>';
            
            if (qa.pairs && qa.pairs.length > 0) {
                html += '<details style="margin-top: 16px;"><summary style="cursor: pointer; font-weight: 600; margin-bottom: 12px;">View Questions</summary>';
                html += '<div class="qa-list">';
                qa.pairs.forEach((pair, idx) => {
                    html += `<div class="qa-item" style="background: #1a2332; border: 1px solid #374151; padding: 12px; margin-bottom: 8px; border-radius: 6px;">`;
                    html += `<div class="qa-question" style="font-weight: 600; color: #60a5fa; margin-bottom: 6px;">Q${idx + 1}: ${pair.questionSpeaker}</div>`;
                    html += `<div class="qa-text" style="color: #e5e7eb; margin-bottom: 8px;">"${pair.questionText.substring(0, 150)}${pair.questionText.length > 150 ? '...' : ''}"</div>`;
                    html += `<div class="qa-metrics" style="font-size: 12px; color: #9ca3af;">Response: ${pair.responseWordCount} words`;
                    if (pair.responseDuration !== null) {
                        html += ` • Duration: ${pair.responseDuration}s`;
                    }
                    html += '</div></div>';
                });
                html += '</div></details>';
            }
            
            html += '</div>';
            container.innerHTML = html;
        }

        function cancelEdit() {
            document.getElementById('editTranscript').style.display = 'none';
            showSpeakerTranscripts(currentSpeaker);
        }

        async function saveEdit() {
            const id = document.getElementById('editTranscriptId').value;
            const title = document.getElementById('editTitle').value.trim();
            const date = document.getElementById('editDate').value;
            const speechType = document.getElementById('editSpeechType').value;
            const fullText = document.getElementById('editFullText').value.trim();
            
            if (!title || !date || !speechType) {
                showAlert('Please fill in all required fields', 'error');
                return;
            }
            
            try {
                const response = await fetch(`/api/admin/transcripts/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title,
                        date,
                        speech_type: speechType,
                        full_dialogue: fullText
                    })
                });
                
                if (!response.ok) throw new Error('Failed to save changes');
                
                showAlert('✅ Transcript updated successfully!', 'success');
                
                // Reload and go back
                await loadSpeakerBoxes();
                setTimeout(() => showSpeakerTranscripts(currentSpeaker), 500);
                
            } catch (error) {
                showAlert('Error saving: ' + error.message, 'error');
            }
        }

        async function deleteTranscript() {
            if (!confirm('Are you sure you want to delete this transcript? This cannot be undone.')) {
                return;
            }
            
            const id = document.getElementById('editTranscriptId').value;
            
            try {
                const response = await fetch(`/api/admin/transcripts/${id}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) throw new Error('Failed to delete transcript');
                
                showAlert('✅ Transcript deleted successfully!', 'success');
                
                // Reload and go back
                await loadSpeakerBoxes();
                setTimeout(() => showSpeakerTranscripts(currentSpeaker), 500);
                
            } catch (error) {
                showAlert('Error deleting: ' + error.message, 'error');
            }
        }

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        async function parseTranscript() {
            const text = document.getElementById('transcriptText').value.trim();
            const hasQA = document.getElementById('hasQA').checked;

            if (!text) {
                showAlert('Please paste a transcript first', 'error');
                return;
            }

            try {
                const response = await fetch('/api/admin/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, detectQA: hasQA })
                });

                if (!response.ok) throw new Error('Parse failed');

                parsedData = await response.json();
                
                // Auto-fill form fields
                if (parsedData.suggestedPrimarySpeaker && !document.getElementById('primarySpeaker').value) {
                    document.getElementById('primarySpeaker').value = parsedData.suggestedPrimarySpeaker;
                }

                // Show Q&A analytics if detected
                if (hasQA && parsedData.qaAnalytics) {
                    displayQAAnalytics(parsedData.qaAnalytics);
                }

                // Show preview
                displayPreview(parsedData);

                // Enable save button
                document.getElementById('saveBtn').disabled = false;

                showAlert(`✅ Parsed ${parsedData.segmentCount} segments`, 'success');
            } catch (error) {
                showAlert('Parse error: ' + error.message, 'error');
            }
        }

        function displayQAAnalytics(qa) {
            const container = document.getElementById('qaAnalytics');
            if (qa.questionCount === 0) {
                container.innerHTML = '<div class="alert alert-warning">⚠️ No questions detected</div>';
                container.style.display = 'block';
                return;
            }

            let html = '<div class="qa-analytics"><h2 style="color: #60a5fa; margin-bottom: 16px;">📊 Q&A Analytics</h2>';
            html += '<div class="qa-stats">';
            html += `<div class="qa-stat"><div class="qa-stat-label">Questions Asked</div><div class="qa-stat-value">${qa.questionCount}</div></div>`;
            html += `<div class="qa-stat"><div class="qa-stat-label">Avg Response Length</div><div class="qa-stat-value">${qa.avgResponseWords} words</div></div>`;
            html += `<div class="qa-stat"><div class="qa-stat-label">Avg Response Time</div><div class="qa-stat-value">${qa.avgResponseSeconds !== null ? qa.avgResponseSeconds + 's' : 'N/A'}</div></div>`;
            html += '</div>';
            
            html += '<details open><summary style="cursor: pointer; font-weight: 600; margin-bottom: 12px;">View Questions</summary>';
            html += '<div class="qa-list">';
            qa.pairs.forEach((pair, idx) => {
                html += `<div class="qa-item">`;
                html += `<div class="qa-question">Q${idx + 1}: ${pair.questionSpeaker}</div>`;
                html += `<div class="qa-text">"${pair.questionText.substring(0, 150)}${pair.questionText.length > 150 ? '...' : ''}"</div>`;
                html += `<div class="qa-metrics">Response: ${pair.responseWordCount} words`;
                if (pair.responseDurationSeconds !== null) {
                    html += ` • ${pair.responseDurationSeconds.toFixed(1)}s`;
                }
                html += `</div></div>`;
            });
            html += '</div></details></div>';

            container.innerHTML = html;
            container.style.display = 'block';
        }

        function displayPreview(data) {
            const container = document.getElementById('previewContent');
            let html = `<p style="color: #9ca3af; margin-bottom: 12px;">Detected ${data.segmentCount} segments from ${data.speakersDetected.length} speakers</p>`;
            html += `<p style="color: #9ca3af; margin-bottom: 12px;">Total duration: ${Math.floor(data.totalSeconds / 60)}:${String(Math.floor(data.totalSeconds % 60)).padStart(2, '0')}</p>`;
            document.getElementById('previewSection').style.display = 'block';
            container.innerHTML = html;
        }

        async function saveTranscript() {
            if (!parsedData) {
                showAlert('Parse the transcript first', 'error');
                return;
            }

            const title = document.getElementById('title').value.trim();
            const eventDate = document.getElementById('eventDate').value;
            const speechType = document.getElementById('speechType').value;
            
            // Get primary speaker (from dropdown or custom input)
            let primarySpeaker = document.getElementById('primarySpeaker').value;
            if (primarySpeaker === '__custom__') {
                primarySpeaker = document.getElementById('customSpeaker').value.trim();
            }
            
            const hasQA = document.getElementById('hasQA').checked;

            if (!title || !eventDate || !speechType || !primarySpeaker) {
                showAlert('Please fill in all required fields', 'error');
                return;
            }

            const payload = {
                title,
                event_date: eventDate,
                speech_type: speechType,
                primary_speaker: primarySpeaker,
                has_q_and_a: hasQA,
                segments: parsedData.segments,
                total_seconds: parsedData.totalSeconds,
                speakers: parsedData.speakersDetected,
                qa_analytics: parsedData.qaAnalytics
            };

            try {
                const response = await fetch('/api/admin/transcripts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Save failed');

                const result = await response.json();
                showAlert('✅ Transcript saved successfully!', 'success');
                
                // Clear form
                setTimeout(() => {
                    document.getElementById('transcriptText').value = '';
                    document.getElementById('title').value = '';
                    document.getElementById('eventDate').value = '';
                    document.getElementById('speechType').value = '';
                    document.getElementById('primarySpeaker').value = '';
                    document.getElementById('hasQA').checked = false;
                    document.getElementById('saveBtn').disabled = true;
                    document.getElementById('qaAnalytics').style.display = 'none';
                    document.getElementById('previewSection').style.display = 'none';
                    parsedData = null;
                }, 1500);
            } catch (error) {
                showAlert('Save error: ' + error.message, 'error');
            }
        }

        // Speech Types Management
        let speechTypes = [];

        async function loadSpeechTypes() {
            try {
                const response = await fetch('/api/speech-types');
                if (!response.ok) throw new Error('Failed to load speech types');
                
                const data = await response.json();
                speechTypes = data.speech_types || [];
                
                displaySpeechTypes();
                updateSpeechTypeDropdowns();
                
            } catch (error) {
                showAlert('Error loading speech types: ' + error.message, 'error');
            }
        }

        function displaySpeechTypes() {
            const container = document.getElementById('speechTypesList');
            
            if (speechTypes.length === 0) {
                container.innerHTML = '<p style="color: #9ca3af;">No custom speech types yet. Add one above!</p>';
                return;
            }
            
            let html = '';
            speechTypes.forEach(type => {
                const isDefault = ['Remarks', 'Press Conference', 'Interview', 'Rally', 'Press Briefing', 'Other'].includes(type);
                html += `
                    <div style="display: inline-flex; align-items: center; gap: 8px; background: ${isDefault ? '#1a2332' : '#2d3748'}; 
                                border: 1px solid ${isDefault ? '#4b5563' : '#3b82f6'}; padding: 8px 12px; border-radius: 6px;">
                        <span style="color: #e5e7eb;">${type}</span>
                        ${!isDefault ? `<button onclick="deleteSpeechType('${type.replace(/'/g, "\\'")}')" 
                                style="background: none; border: none; color: #ef4444; cursor: pointer; padding: 0 4px; font-size: 16px;"
                                title="Delete">✕</button>` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        async function addSpeechType() {
            const input = document.getElementById('newSpeechType');
            const newType = input.value.trim();
            
            if (!newType) {
                showAlert('Please enter a speech type name', 'error');
                return;
            }
            
            if (speechTypes.includes(newType)) {
                showAlert('This speech type already exists', 'warning');
                return;
            }
            
            try {
                const response = await fetch('/api/speech-types', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ speech_type: newType })
                });
                
                if (!response.ok) throw new Error('Failed to add speech type');
                
                showAlert(`✅ Added speech type: ${newType}`, 'success');
                input.value = '';
                await loadSpeechTypes();
                
            } catch (error) {
                showAlert('Error adding speech type: ' + error.message, 'error');
            }
        }

        async function deleteSpeechType(type) {
            if (!confirm(`Delete speech type "${type}"? Existing transcripts will not be affected.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/speech-types/${encodeURIComponent(type)}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) throw new Error('Failed to delete speech type');
                
                showAlert(`✅ Deleted speech type: ${type}`, 'success');
                await loadSpeechTypes();
                
            } catch (error) {
                showAlert('Error deleting speech type: ' + error.message, 'error');
            }
        }

        function updateSpeechTypeDropdowns() {
            // Update the upload form dropdown
            const uploadDropdown = document.getElementById('speechType');
            const editDropdown = document.getElementById('editSpeechType');
            
            [uploadDropdown, editDropdown].forEach(dropdown => {
                if (!dropdown) return;
                
                const currentValue = dropdown.value;
                dropdown.innerHTML = '<option value="">Select...</option>';
                
                speechTypes.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    dropdown.appendChild(option);
                });
                
                // Restore previous selection if it still exists
                if (currentValue && speechTypes.includes(currentValue)) {
                    dropdown.value = currentValue;
                }
            });
        }

        // Load speech types on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSpeechTypes();
        });
    </script>
</body>
</html>
