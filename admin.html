<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MentionMarkets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1a2332;
            color: #e5e7eb;
            font-size: 14px;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #374151;
        }

        h1 {
            font-size: 28px;
            color: #3b82f6;
        }

        .back-link {
            padding: 8px 16px;
            background: #374151;
            color: #e5e7eb;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .back-link:hover {
            background: #4b5563;
        }

        .card {
            background: #2d3748;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #60a5fa;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #9ca3af;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #1a2332;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #e5e7eb;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        textarea {
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-secondary {
            background: #374151;
        }

        .button-secondary:hover {
            background: #4b5563;
        }

        .qa-analytics {
            background: #1e3a5f;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 16px;
        }

        .qa-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .qa-stat {
            background: #1a2332;
            padding: 12px;
            border-radius: 6px;
        }

        .qa-stat-label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .qa-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
        }

        .qa-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .qa-item {
            background: #1a2332;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .qa-question {
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 6px;
        }

        .qa-text {
            font-size: 13px;
            color: #d1d5db;
            font-style: italic;
            margin-bottom: 8px;
        }

        .qa-metrics {
            font-size: 12px;
            color: #9ca3af;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .alert-success {
            background: #064e3b;
            border: 1px solid #10b981;
            color: #6ee7b7;
        }

        .alert-error {
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .alert-warning {
            background: #78350f;
            border: 1px solid #f59e0b;
            color: #fcd34d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <a href="/" class="back-link">← Back to Search</a>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <h2>Upload Transcript</h2>
            
            <div class="form-group">
                <label>Transcript Text (Otter.ai format)</label>
                <textarea id="transcriptText" rows="12" placeholder="Paste your Otter.ai transcript here...

Example format:
Speaker Name  0:22  
Text content here...

Speaker Name  1:30  
More text..."></textarea>
            </div>

            <div class="form-group">
                <label>Title</label>
                <input type="text" id="title" placeholder="e.g., Mayor Mamdani Press Conference">
            </div>

            <div class="form-group">
                <label>Event Date</label>
                <input type="date" id="eventDate">
            </div>

            <div class="form-group">
                <label>Speech Type</label>
                <select id="speechType">
                    <option value="">Select...</option>
                    <option value="Remarks">Remarks</option>
                    <option value="Press Conference">Press Conference</option>
                    <option value="Interview">Interview</option>
                    <option value="Rally">Rally</option>
                    <option value="Press Briefing">Press Briefing</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Primary Speaker</label>
                <input type="text" id="primarySpeaker" placeholder="e.g., Zohran Mamdani">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="hasQA">
                <label for="hasQA" style="margin-bottom: 0;">Has Q&A Section (auto-detect questions)</label>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button onclick="parseTranscript()">📊 Parse Transcript</button>
                <button onclick="saveTranscript()" class="button-secondary" id="saveBtn" disabled>💾 Save to Database</button>
            </div>
        </div>

        <div id="qaAnalytics" style="display: none;"></div>

        <div id="previewSection" style="display: none;">
            <div class="card">
                <h2>Preview</h2>
                <div id="previewContent"></div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = null;

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        async function parseTranscript() {
            const text = document.getElementById('transcriptText').value.trim();
            const hasQA = document.getElementById('hasQA').checked;

            if (!text) {
                showAlert('Please paste a transcript first', 'error');
                return;
            }

            try {
                const response = await fetch('/api/admin/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, detectQA: hasQA })
                });

                if (!response.ok) throw new Error('Parse failed');

                parsedData = await response.json();
                
                // Auto-fill form fields
                if (parsedData.suggestedPrimarySpeaker && !document.getElementById('primarySpeaker').value) {
                    document.getElementById('primarySpeaker').value = parsedData.suggestedPrimarySpeaker;
                }

                // Show Q&A analytics if detected
                if (hasQA && parsedData.qaAnalytics) {
                    displayQAAnalytics(parsedData.qaAnalytics);
                }

                // Show preview
                displayPreview(parsedData);

                // Enable save button
                document.getElementById('saveBtn').disabled = false;

                showAlert(`✅ Parsed ${parsedData.segmentCount} segments`, 'success');
            } catch (error) {
                showAlert('Parse error: ' + error.message, 'error');
            }
        }

        function displayQAAnalytics(qa) {
            const container = document.getElementById('qaAnalytics');
            if (qa.questionCount === 0) {
                container.innerHTML = '<div class="alert alert-warning">⚠️ No questions detected</div>';
                container.style.display = 'block';
                return;
            }

            let html = '<div class="qa-analytics"><h2 style="color: #60a5fa; margin-bottom: 16px;">📊 Q&A Analytics</h2>';
            html += '<div class="qa-stats">';
            html += `<div class="qa-stat"><div class="qa-stat-label">Questions Asked</div><div class="qa-stat-value">${qa.questionCount}</div></div>`;
            html += `<div class="qa-stat"><div class="qa-stat-label">Avg Response Length</div><div class="qa-stat-value">${qa.avgResponseWords} words</div></div>`;
            html += `<div class="qa-stat"><div class="qa-stat-label">Avg Response Time</div><div class="qa-stat-value">${qa.avgResponseSeconds !== null ? qa.avgResponseSeconds + 's' : 'N/A'}</div></div>`;
            html += '</div>';
            
            html += '<details open><summary style="cursor: pointer; font-weight: 600; margin-bottom: 12px;">View Questions</summary>';
            html += '<div class="qa-list">';
            qa.pairs.forEach((pair, idx) => {
                html += `<div class="qa-item">`;
                html += `<div class="qa-question">Q${idx + 1}: ${pair.questionSpeaker}</div>`;
                html += `<div class="qa-text">"${pair.questionText.substring(0, 150)}${pair.questionText.length > 150 ? '...' : ''}"</div>`;
                html += `<div class="qa-metrics">Response: ${pair.responseWordCount} words`;
                if (pair.responseDurationSeconds !== null) {
                    html += ` • ${pair.responseDurationSeconds.toFixed(1)}s`;
                }
                html += `</div></div>`;
            });
            html += '</div></details></div>';

            container.innerHTML = html;
            container.style.display = 'block';
        }

        function displayPreview(data) {
            const container = document.getElementById('previewContent');
            let html = `<p style="color: #9ca3af; margin-bottom: 12px;">Detected ${data.segmentCount} segments from ${data.speakersDetected.length} speakers</p>`;
            html += `<p style="color: #9ca3af; margin-bottom: 12px;">Total duration: ${Math.floor(data.totalSeconds / 60)}:${String(Math.floor(data.totalSeconds % 60)).padStart(2, '0')}</p>`;
            document.getElementById('previewSection').style.display = 'block';
            container.innerHTML = html;
        }

        async function saveTranscript() {
            if (!parsedData) {
                showAlert('Parse the transcript first', 'error');
                return;
            }

            const title = document.getElementById('title').value.trim();
            const eventDate = document.getElementById('eventDate').value;
            const speechType = document.getElementById('speechType').value;
            const primarySpeaker = document.getElementById('primarySpeaker').value.trim();
            const hasQA = document.getElementById('hasQA').checked;

            if (!title || !eventDate || !speechType || !primarySpeaker) {
                showAlert('Please fill in all required fields', 'error');
                return;
            }

            const payload = {
                title,
                event_date: eventDate,
                speech_type: speechType,
                primary_speaker: primarySpeaker,
                has_q_and_a: hasQA,
                segments: parsedData.segments,
                total_seconds: parsedData.totalSeconds,
                speakers: parsedData.speakersDetected,
                qa_analytics: parsedData.qaAnalytics
            };

            try {
                const response = await fetch('/api/admin/transcripts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Save failed');

                const result = await response.json();
                showAlert('✅ Transcript saved successfully!', 'success');
                
                // Clear form
                setTimeout(() => {
                    document.getElementById('transcriptText').value = '';
                    document.getElementById('title').value = '';
                    document.getElementById('eventDate').value = '';
                    document.getElementById('speechType').value = '';
                    document.getElementById('primarySpeaker').value = '';
                    document.getElementById('hasQA').checked = false;
                    document.getElementById('saveBtn').disabled = true;
                    document.getElementById('qaAnalytics').style.display = 'none';
                    document.getElementById('previewSection').style.display = 'none';
                    parsedData = null;
                }, 1500);
            } catch (error) {
                showAlert('Save error: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
