# Render Blueprint - MentionMarkets Web App
# This will be auto-detected and deployed by Render

services:
  # Next.js Web Service
  - type: web
    name: mention-markets-web
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: web
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: changeme-admin-2024
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mention-markets-db
          property: connectionString

databases:
  - name: mention-markets-db
    databaseName: mention_markets
    user: mention_markets_user
    plan: free
    region: oregon
